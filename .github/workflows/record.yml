name: Re-record README animation (Inter + Fira Code fonts)
on:
  workflow_dispatch:
  push:
    paths: [index.html, scripts/record.mjs]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-firacode fonts-noto-color-emoji
          fc-cache -f
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run record
      - name: Commit GIFs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/*.gif
          git diff --cached --quiet || (git commit -m "chore: re-record README animation" && git push)
